<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예수님 카드 뒤집기</title>
    <meta name="description" content="예수님 카드를 찾아 짝을 맞추고 보너스 룰렛 선물을 뽑는 예수님 마을 카드 게임" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joyfulkim.github.io/jcard/" />
    <meta property="og:title" content="예수님 마을 카드 게임" />
    <meta property="og:description" content="예수님 카드를 찾아 짝을 맞추고 보너스 룰렛 선물을 뽑아보세요!" />
    <meta property="og:image" content="https://joyfulkim.github.io/jcard/assets/kakao-thumbnail.png" />
    <meta property="og:image:secure_url" content="https://joyfulkim.github.io/jcard/assets/kakao-thumbnail.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="예수님 마을 카드 게임 썸네일" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="예수님 마을 카드 게임" />
    <meta name="twitter:description" content="예수님 카드를 찾아 짝을 맞추고 보너스 룰렛 선물을 뽑아보세요!" />
    <meta name="twitter:image" content="https://joyfulkim.github.io/jcard/assets/kakao-thumbnail.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="bunting bunting-left">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="bunting bunting-right">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="balloons">
        <span></span><span></span><span></span>
      </div>
      <div class="village">
        <div class="church">
          <span class="cross"></span>
          <span class="roof"></span>
        </div>
        <div class="shop">
          <span>선물</span>
        </div>
        <div class="house house-one"></div>
        <div class="house house-two"></div>
      </div>
    </div>

    <main class="game-shell">
      <section class="board-wrap" aria-label="카드판">
        <div class="board" id="gameBoard"></div>
      </section>

      <section class="hud-panel" aria-label="게임 정보">
        <div class="score-row" aria-live="polite">
          <div class="score-box">
            <span>찾은 짝</span>
            <strong id="matchCount">0</strong>
          </div>
          <div class="score-box">
            <span>뒤집기</span>
            <strong id="moveCount">0</strong>
          </div>
          <button class="reset-button" id="resetButton" type="button">다시 섞기</button>
          <button class="bonus-button" id="bonusButton" type="button">보너스 게임</button>
        </div>
      </section>
    </main>

    <section class="result-overlay is-hidden" id="resultOverlay" aria-hidden="true">
      <div class="result-modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <h2 id="resultTitle">10번 뒤집기가 끝났어요!</h2>
        <p class="result-count">찾은 짝: <strong id="finalMatchCount">0</strong>짝</p>
        <p class="result-guide">확인 후 다시 섞기 버튼을 눌러 새 게임을 시작해 주세요.</p>
        <button class="result-confirm-button" id="resultConfirmButton" type="button">확인</button>
      </div>
    </section>

    <section class="roulette-overlay is-hidden" id="rouletteOverlay" aria-hidden="true">
      <div class="roulette-modal" role="dialog" aria-modal="true" aria-labelledby="rouletteTitle">
        <button class="roulette-close" id="rouletteClose" type="button" aria-label="룰렛 닫기">×</button>
        <h2 id="rouletteTitle">보너스 게임</h2>
        <div class="roulette-stage">
          <div class="roulette-pointer" aria-hidden="true"></div>
          <div class="roulette-wheel" id="rouletteWheel" aria-hidden="true">
            <img class="roulette-wheel-image" src="assets/roulette-board.png" alt="" />
          </div>
          <img class="roulette-center-image" src="assets/roulette-board.png" alt="" aria-hidden="true" />
        </div>
        <p class="roulette-result" id="rouletteResult" aria-live="polite">버튼을 눌러 선물을 뽑아보세요.</p>
        <button class="spin-button" id="spinButton" type="button">룰렛 돌리기</button>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
